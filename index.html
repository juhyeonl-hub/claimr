<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claimr — Walk. Claim. Conquer.</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e6edf3;
    background: linear-gradient(135deg, #173A52 0%, #0A1622 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
  }
  .wrap { max-width: 560px; }
  .mark {
    width: 108px; height: 108px; margin: 0 auto 28px; display: block;
  }
  h1 { font-size: 3rem; letter-spacing: -1px; margin-bottom: 10px; }
  .tag { color: #46D588; font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
  .sub { color: #8CA3B8; font-size: 1.05rem; margin-bottom: 36px; }
  .teams { color: #8CA3B8; font-weight: 600; margin-bottom: 40px; }
  .teams b.fi { color: #4FA8E0; } .teams b.se { color: #F5C518; }
  .links a {
    color: #46D588; text-decoration: none; margin: 0 14px; font-size: .95rem;
    border-bottom: 1px solid rgba(70,213,136,.35); padding-bottom: 2px;
  }
  .links a:hover { border-color: #46D588; }
  footer { margin-top: 48px; color: #5b7085; font-size: .85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#46D588"/><stop offset="1" stop-color="#12A85A"/>
        </linearGradient>
      </defs>
      <path d="M50 27 L69.9 38.5 L69.9 61.5 L50 73 L30.1 61.5 L30.1 38.5 Z" fill="url(#g)"/>
      <g transform="translate(50,57)">
        <path d="M0 0 C-3.4 -6.5 -7.5 -9 -7.5 -14 a7.5 7.5 0 1 1 15 0 C7.5 -9 3.4 -6.5 0 0 Z" fill="#0A1622"/>
        <circle cx="0" cy="-14" r="3" fill="#46D588"/>
      </g>
    </svg>
    <h1>Claimr</h1>
    <div class="tag">Walk. Claim. Conquer.</div>
    <div class="sub">Turn your daily walks into a territory war on the real map.</div>
    <div class="teams"><b class="fi">FINLAND</b> &nbsp;vs&nbsp; <b class="se">SWEDEN</b></div>
    <div class="links">
      <a href="./privacy/">Privacy Policy</a>
      <a href="mailto:juhyeonl.dev@gmail.com">Contact</a>
    </div>
    <footer>© 2026 Claimr · An independent app made in Finland</footer>
  </div>
</body>
</html>
